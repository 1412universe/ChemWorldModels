<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据日志 — 工作流运行记录</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236366f1'/%3E%3Cpath d='M9 16h5m4 0h5M14 10v12' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='16' r='3' fill='%23fff'/%3E%3Ccircle cx='23' cy='16' r='3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/app.css?v=20261014l">
<style>
  body.page-datalog{ margin:0; background:#eef1f6; color:#1e293b; }
  body.page-datalog #app{ height:calc(100vh - 32px); display:grid; grid-template-columns:280px 1fr; min-height:0; }
  .dl-side{ background:#fff; border-right:1px solid #dfe4ec; display:flex; flex-direction:column; min-height:0; }
  .dl-side h2{ margin:0; padding:14px 14px 4px; font-size:15px; }
  .dl-side .sub{ padding:0 14px 10px; color:#64748b; font-size:12px; }
  .dl-list{ flex:1; overflow:auto; padding:0 8px 12px; }
  .dl-wf{ width:100%; text-align:left; border:0; background:transparent; border-radius:8px; padding:8px 10px; cursor:pointer; }
  .dl-wf:hover{ background:#f8fafc; }
  .dl-wf.on{ background:#eef2ff; }
  .dl-wf b{ display:block; font-size:13px; }
  .dl-wf span{ color:#64748b; font-size:11px; }
  .dl-main{ min-width:0; display:flex; flex-direction:column; }
  .dl-bar{ display:flex; align-items:center; gap:8px; padding:10px 14px; background:#fff; border-bottom:1px solid #dfe4ec; }
  .dl-bar h3{ margin:0; font-size:14px; flex:1; }
  .dl-table-wrap{ flex:1; overflow:auto; padding:10px 14px 16px; }
  table.dl{ border-collapse:collapse; font-size:12px; background:#fff; min-width:100%; }
  table.dl th, table.dl td{ border:1px solid #e5eaf1; padding:5px 7px; white-space:nowrap; text-align:left; }
  table.dl th{ position:sticky; top:0; background:#334155; color:#fff; font-weight:600; z-index:1; }
  table.dl td.dl-run{ white-space:nowrap; font-weight:600; color:#1e293b; background:#f8fafc; }
  table.dl td.dl-err{ white-space:pre-wrap; min-width:280px; max-width:460px; vertical-align:top; }
  table.dl td.dl-wrap{ white-space:pre-wrap; max-width:280px; vertical-align:top; }
  .dl-empty{ color:#94a3b8; padding:28px 8px; font-size:13px; }
  .dl-bar a.btn{ text-decoration:none; border:1px solid #6366f1; background:#6366f1; color:#fff; border-radius:8px; padding:4px 10px; font-size:12px; }
  .dl-bar button{ border:1px solid #d7dde8; background:#fff; border-radius:8px; padding:4px 10px; cursor:pointer; }
</style>
</head>
<body class="page-datalog">
<nav class="topnav">
  <span class="brand">🧩 工作流编辑器 · Uni-Lab OS</span>
  <a href="index.html" data-icon="📊">总览-510</a>
  <a href="overview_photo.html" data-icon="☀️">总览-光催化闭环设计</a>
  <a href="workflow_editor.html" data-icon="🛠️">工作流编辑器</a>
  <a href="datalog.html" class="active" data-icon="📋">数据日志</a>
</nav>
<div id="app">
  <aside class="dl-side">
    <h2>工作流</h2>
    <div class="sub" id="dl-dir">每个工作流一张表，一行一次运行</div>
    <div class="dl-list" id="dl-wfs"><div class="dl-empty">加载中…</div></div>
  </aside>
  <section class="dl-main">
    <div class="dl-bar">
      <h3 id="dl-title">选择左侧一份工作流</h3>
      <button id="dl-refresh" type="button">刷新</button>
      <a class="btn" id="dl-xlsx" href="#" style="display:none">下载 xlsx</a>
    </div>
    <div class="dl-table-wrap" id="dl-table"><div class="dl-empty">还没有打开的运行记录。</div></div>
  </section>
</div>
<script>
(function () {
  var workflows = [];
  var currentWf = '';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function renderWfs() {
    var box = document.getElementById('dl-wfs');
    if (!workflows.length) {
      box.innerHTML = '<div class="dl-empty">还没有运行记录。在工作流编辑器里跑一次后，这里会出现。</div>';
      return;
    }
    box.innerHTML = workflows.map(function (w) {
      var name = w.workflow_name || '未命名工作流';
      return '<button type="button" class="dl-wf' + (name === currentWf ? ' on' : '') + '" data-wf="' + esc(name) + '"><b>' + esc(name) + '</b><span>' + (w.runs || 0) + ' 次运行' + (w.latest_at ? ' · ' + esc(w.latest_at) : '') + '</span></button>';
    }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('.dl-wf'), function (b) {
      b.addEventListener('click', function () { openWf(b.getAttribute('data-wf')); });
    });
  }
  function openWf(name) {
    currentWf = name;
    renderWfs();
    document.getElementById('dl-title').textContent = name;
    var link = document.getElementById('dl-xlsx');
    link.href = '/api/datalog/workflow/' + encodeURIComponent(name) + '/xlsx';
    link.style.display = '';
    var host = document.getElementById('dl-table');
    host.innerHTML = '<div class="dl-empty">读取中…</div>';
    fetch('/api/datalog/workflow/' + encodeURIComponent(name)).then(function (r) { return r.json(); }).then(function (res) {
      var rows = (res && res.records) || [];
      if (!res || res.ok === false) {
        host.innerHTML = '<div class="dl-empty">' + esc((res && res.error) || '读不到') + '</div>';
        return;
      }
      if (!rows.length) {
        host.innerHTML = '<div class="dl-empty">这份工作流还没有运行记录。</div>';
        return;
      }
      var cols = (res.columns && res.columns.length) ? res.columns : Object.keys(rows[0]);
      var html = '<table class="dl"><thead><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
      rows.forEach(function (row) {
        html += '<tr>' + cols.map(function (c) {
          var cls = '';
          if (c === '运行') cls = ' class="dl-run"';
          else if (c === '报错日志') cls = ' class="dl-err"';
          else if (c === '设定与结果' || c === '节点') cls = ' class="dl-wrap"';
          return '<td' + cls + '>' + esc(row[c]) + '</td>';
        }).join('') + '</tr>';
      });
      html += '</tbody></table>';
      host.innerHTML = html;
    }).catch(function () {
      host.innerHTML = '<div class="dl-empty">网络或后端没有响应。</div>';
    });
  }
  function load() {
    fetch('/api/datalog').then(function (r) { return r.json(); }).then(function (res) {
      workflows = (res && res.workflows) || [];
      if (!workflows.length && res && res.runs && res.runs.length) {
        var map = {};
        res.runs.forEach(function (r) {
          var k = r.workflow_name || '未命名工作流';
          if (!map[k]) map[k] = { workflow_name: k, runs: 0, latest_at: r.started_at || '', xlsx: r.xlsx };
          map[k].runs += 1;
        });
        workflows = Object.keys(map).map(function (k) { return map[k]; });
      }
      var dir = document.getElementById('dl-dir');
      if (res && res.dir) dir.textContent = res.dir + ' · 每个工作流一张表';
      if (currentWf && workflows.some(function (w) { return w.workflow_name === currentWf; })) openWf(currentWf);
      else {
        currentWf = '';
        renderWfs();
        if (workflows.length) openWf(workflows[0].workflow_name);
      }
    }).catch(function () {
      document.getElementById('dl-wfs').innerHTML = '<div class="dl-empty">连不上后端。</div>';
    });
  }
  document.getElementById('dl-refresh').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
